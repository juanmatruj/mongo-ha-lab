name: Provision and validate

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Provision the lab and run the test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Ansible collections
        working-directory: ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Add hostnames to /etc/hosts
        run: |
          echo "127.0.0.1 mongo1 mongo2 mongo3" | sudo tee -a /etc/hosts
          getent hosts mongo1 mongo2 mongo3

      - name: Prepare the replica set keyfile
        run: |
          mkdir -p secrets
          openssl rand -base64 756 > secrets/keyfile
          sudo chown 999:999 secrets/keyfile
          sudo chmod 400 secrets/keyfile
          ls -ln secrets/keyfile

      - name: Provision the lab
        working-directory: ansible
        env:
          VAULT_PASS: ${{ secrets.VAULT_PASSWORD }}
        run: |
          printf '#!/bin/sh\nprintf "%%s" "$VAULT_PASS"\n' > /tmp/vault-client
          chmod 700 /tmp/vault-client
          ansible-playbook site.yml --vault-password-file /tmp/vault-client
          rm -f /tmp/vault-client

      - name: Run the test suite
        env:
          MONGO_ADMIN_PASS: ${{ secrets.MONGO_ADMIN_PASS }}
          MONGO_APP_PASS: ${{ secrets.MONGO_APP_PASS }}
        run: pytest tests/ -v

      - name: Show container logs on failure
        if: failure()
        run: |
          docker ps -a
          for c in mongo1 mongo2 mongo3; do
            echo "===== $c ====="
            docker logs "$c" --tail 40 || true
          done
