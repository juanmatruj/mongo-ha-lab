---
- name: Ensure secrets directory exists
  ansible.builtin.file:
    path: "{{ secrets_dir }}"
    state: directory
    mode: "0755"

- name: Generate replica set keyfile
  ansible.builtin.shell: "openssl rand -base64 {{ keyfile_bytes }} > {{ keyfile_path }}"
  args:
    creates: "{{ keyfile_path }}"

- name: Check keyfile ownership and permissions
  ansible.builtin.stat:
    path: "{{ keyfile_path }}"
  register: keyfile_stat

- name: Fail if keyfile permissions are not as MongoDB requires
  ansible.builtin.fail:
    msg: |
      The keyfile must be owned by UID {{ container_uid }} with mode 0400.
      MongoDB refuses to start otherwise ("permissions are too open").
      This step requires root and is not automated. Run:

        sudo chown {{ container_uid }}:{{ container_gid }} {{ keyfile_path }}
        sudo chmod 400 {{ keyfile_path }}

      Current: uid={{ keyfile_stat.stat.uid }} mode={{ keyfile_stat.stat.mode }}
  when: >
    keyfile_stat.stat.uid != container_uid | int
    or keyfile_stat.stat.mode != '0400'
